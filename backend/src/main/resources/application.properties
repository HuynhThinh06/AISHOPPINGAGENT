spring.application.name=shopping-agent

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopping_agent}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# LLM
# ==========================================
llm.provider=${LLM_PROVIDER:gemini}
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
llm.gemini.max-retries=2
llm.gemini.timeout-seconds=30

# ==========================================
# RANKING WEIGHTS (fallback nếu DB trống)
# ==========================================
ranking.default.weight.price=0.35
ranking.default.weight.spec-match=0.45
ranking.default.weight.rating=0.20

# ==========================================
# SERVER
# ==========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
